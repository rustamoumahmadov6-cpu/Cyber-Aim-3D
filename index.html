<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Strike: Battle Zone 3D - Ultimate Edition</title>
    <style>
        /* ==========================================
           СТИЛҲОИ АСВӢ ВА ИНТЕРФЕЙСИ БОЗӢ (UI/UX)
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            overflow: hidden;
            background-color: #010103;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
            z-index: 10;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .hud-box {
            background: rgba(15, 10, 30, 0.85);
            border: 2px solid #ffcc00;
            padding: 12px 25px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 8px #ffcc00;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 32px;
            border: 2px solid #ff3300;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 15px #ff3300;
            transition: transform 0.08s ease;
            z-index: 10;
        }

        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background-color: #ffcc00;
            border-radius: 50%;
        }

        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a0b2e 0%, #030108 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
        }

        h1 {
            font-size: 4.8rem;
            color: #ff3300;
            text-shadow: 0 0 30px #ff3300, 0 0 60px #ffcc00;
            margin-bottom: 10px;
            letter-spacing: 4px;
            text-align: center;
        }

        p.subtitle {
            font-size: 1.4rem;
            color: #b8b8d1;
            margin-bottom: 45px;
            letter-spacing: 1.5px;
            text-align: center;
        }

        .btn-game {
            background: linear-gradient(45deg, #ff3300, #ff9900);
            border: none;
            color: white;
            padding: 18px 45px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 51, 0, 0.6);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            outline: none;
        }

        .btn-game:hover {
            transform: scale(1.1);
            box-shadow: 0 0 45px rgba(255, 204, 0, 0.9);
            background: linear-gradient(45deg, #ffcc00, #ff9900);
            color: #010103;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 20, 0.96);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
        }

        #game-over-screen h2 {
            font-size: 3.8rem;
            color: #ff3300;
            text-shadow: 0 0 25px #ff3300;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 40px;
            text-align: center;
            width: 450px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 204, 0, 0.4);
            font-size: 1.1rem;
        }

        .stat-item span {
            display: block;
            font-size: 2.2rem;
            color: #ffcc00;
            margin-top: 8px;
            text-shadow: 0 0 12px rgba(255, 204, 0, 0.5);
        }

        #damage-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 51, 0, 0.35);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
            z-index: 15;
        }
    </style>
</head>
<body>

    <div id="damage-flash"></div>

    <div id="ui-container">
        <div class="hud-row">
            <div class="hud-box">Ҳисоб: <span id="score">0</span></div>
            <div class="hud-box">Вақт: <span id="timer">60</span>с</div>
            <div class="hud-box">Дақиқӣ: <span id="accuracy">100</span>%</div>
        </div>
        <div class="hud-row">
            <div class="hud-box" style="font-size: 17px; border-color: #ff3300; color: #ff3300; text-shadow: 0 0 8px #ff3300;">Майдони Ҷанг: Идоракунии 3D</div>
            <div class="hud-box" style="font-size: 17px;">Тирҳо: <span id="shots-fired">0</span></div>
        </div>
    </div>

    <div id="crosshair"></div>

    <!-- Менюи асосӣ -->
    <div id="menu-screen">
        <h1>CYBER STRIKE</h1>
        <p class="subtitle">Системаи мукаммали набардҳои сеченака бо графикаи пешрафта</p>
        <button class="btn-game" onclick="startGame()">Оғози Ҷанг</button>
    </div>

    <!-- Экрани Ба охир расидани бозӣ -->
    <div id="game-over-screen">
        <h2>ҶАНГ БА ОХИР РАСИД</h2>
        <div class="stats-grid">
            <div class="stat-item">Ҳисоби ниҳоӣ <span id="final-score">0</span></div>
            <div class="stat-item">Дақиқии умумӣ <span id="final-accuracy">0%</span></div>
        </div>
        <button class="btn-game" onclick="startGame()">Ҷанги Нав</button>
    </div>

    <!-- Китобхонаи Three.js барои графикаи 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        /* ==========================================
           ЛОГИКАИ БОЗӢ ВА ИДОРАКУНИИ ТЕХНИКИИ 3D
           ========================================== */
        let scene, camera, renderer;
        let enemies = [];
        let score = 0;
        let timeLeft = 60;
        let gameActive = false;
        let timerInterval;
        let shotsFired = 0;
        let hitsCount = 0;

        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const accuracyEl = document.getElementById('accuracy');
        const shotsFiredEl = document.getElementById('shots-fired');
        const menuScreen = document.getElementById('menu-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const finalAccuracyEl = document.getElementById('final-accuracy');
        const crosshair = document.getElementById('crosshair');
        const damageFlash = document.getElementById('damage-flash');

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x010103);
            scene.fog = new THREE.FogExp2(0x010103, 0.035);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Танзими равшании муҳити Ҷанг
            const ambientLight = new THREE.AmbientLight(0x444466, 0.9);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffaa00, 1.5);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            const pointLight1 = new THREE.PointLight(0xff3300, 3, 100);
            pointLight1.position.set(-15, 10, 10);
            scene.add(pointLight1);

            // Сохтани замина ва харобазорҳо
            createBattlefieldEnvironment();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onDocumentClick);
        }

        function createBattlefieldEnvironment() {
            // Фарш ё замин
            const floorGeo = new THREE.PlaneGeometry(120, 120);
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0x0c0c14,
                roughness: 0.8,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -6;
            scene.add(floor);

            const grid = new THREE.GridHelper(120, 60, 0xff3300, 0x222244);
            grid.position.y = -5.9;
            scene.add(grid);

            // Сохтани монеаҳо ва деворҳои харобшуда барои фазои ҷангӣ
            for(let i = 0; i < 25; i++) {
                const wGeo = new THREE.BoxGeometry(
                    3 + Math.random() * 4,
                    4 + Math.random() * 8,
                    3 + Math.random() * 4
                );
                const wMat = new THREE.MeshStandardMaterial({
                    color: 0x1a1a26,
                    roughness: 0.7,
                    metalness: 0.4
                });
                const obstacle = new THREE.Mesh(wGeo, wMat);
                obstacle.position.set(
                    (Math.random() - 0.5) * 90,
                    -2,
                    (Math.random() - 0.5) * 90 - 15
                );
                scene.add(obstacle);
            }
        }

        function spawnEnemies() {
            enemies.forEach(e => scene.remove(e.mesh));
            enemies = [];

            let count = 6 + Math.floor(score / 50);
            for (let i = 0; i < count; i++) {
                const geo = new THREE.DodecahedronGeometry(1.2);
                const mat = new THREE.MeshStandardMaterial({
                    color: Math.random() > 0.5 ? 0xff3300 : 0xffaa00,
                    emissive: Math.random() > 0.5 ? 0xff3300 : 0xffaa00,
                    emissiveIntensity: 0.8,
                    roughness: 0.2,
                    metalness: 0.8
                });

                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(
                    (Math.random() - 0.5) * 22,
                    (Math.random() - 0.5) * 12,
                    (Math.random() - 0.5) * 10 - 5
                );

                scene.add(mesh);
                enemies.push({
                    mesh: mesh,
                    dx: (Math.random() - 0.5) * 0.06,
                    dy: (Math.random() - 0.5) * 0.06,
                    rx: (Math.random() - 0.5) * 0.05,
                    ry: (Math.random() - 0.5) * 0.05
                });
            }
        }

        function startGame() {
            menuScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';

            score = 0;
            timeLeft = 60;
            shotsFired = 0;
            hitsCount = 0;
            gameActive = true;

            scoreEl.textContent = score;
            timerEl.textContent = timeLeft;
            accuracyEl.textContent = '100';
            shotsFiredEl.textContent = shotsFired;

            spawnEnemies();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            enemies.forEach(e => scene.remove(e.mesh));
            enemies = [];

            finalScoreEl.textContent = score;
            let finalAcc = shotsFired > 0 ? Math.round((hitsCount / shotsFired) * 100) : 0;
            finalAccuracyEl.textContent = finalAcc + '%';

            gameOverScreen.style.display = 'flex';
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onDocumentClick(event) {
            if (!gameActive) return;

            shotsFired++;
            shotsFiredEl.textContent = shotsFired;

            crosshair.style.transform = 'translate(-50%, -50%) scale(1.7)';
            setTimeout(() => {
                crosshair.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 100);

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            let meshList = enemies.map(e => e.mesh);
            let intersects = raycaster.intersectObjects(meshList);

            if (intersects.length > 0) {
                hitsCount++;
                score += 25;
                scoreEl.textContent = score;

                let hitTarget = intersects[0].object;
                hitTarget.material.color.setHex(0xffffff);
                hitTarget.material.emissive.setHex(0xffffff);

                setTimeout(() => {
                    scene.remove(hitTarget);
                    enemies = enemies.filter(e => e.mesh !== hitTarget);
                    if (enemies.length === 0) {
                        spawnEnemies();
                    }
                }, 120);
            } else {
                damageFlash.style.opacity = '1';
                setTimeout(() => { damageFlash.style.opacity = '0'; }, 150);
            }

            let currentAcc = Math.round((hitsCount / shotsFired) * 100);
            accuracyEl.textContent = currentAcc;
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);

            if (gameActive) {
                enemies.forEach(e => {
                    e.mesh.rotation.x += e.rx;
                    e.mesh.rotation.y += e.ry;

                    e.mesh.position.x += e.dx;
                    e.mesh.position.y += e.dy;

                    if (Math.abs(e.mesh.position.x) > 14) e.dx *= -1;
                    if (Math.abs(e.mesh.position.y) > 8) e.dy *= -1;
                });
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        initScene();
        animateLoop();
    </script>
</body>
</html>
